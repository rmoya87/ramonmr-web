name: Deploy own code to IONOS
on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/ramon-native/**'
      - 'wp-content/plugins/ramon-site/**'
      - 'wp-content/plugins/ramon-touring/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate SFTP and compare files without changes
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ramonmr-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'rmoya87/ramonmr-web' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: PHP syntax
        run: find wp-content/themes/ramon-native wp-content/plugins/ramon-site wp-content/plugins/ramon-touring -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install SFTP library
        run: python3 -m pip install 'paramiko==3.5.1'
      - name: Compare, back up, deploy and verify
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python3 - <<'PY'
          import paramiko,pathlib,hashlib,os,stat,urllib.request,time,json
          HOST='home450716952.1and1-data.host'; USER='acc912456172'
          PIN='AAAAC3NzaC1lZDI1NTE5AAAAINbBMvvDjN4IP04VAZlDH42A+HL25ifeIK9CorAvaMA/'
          class PinnedKey(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,client,hostname,key):
                  if key.get_name()!='ssh-ed25519' or key.get_base64()!=PIN: raise RuntimeError('Host key differs from verified pin')
          def digest(data): return hashlib.sha256(data).hexdigest()
          client=paramiko.SSHClient();client.set_missing_host_key_policy(PinnedKey())
          client.connect(HOST,port=22,username=USER,password=os.environ['SFTP_PASSWORD'],allow_agent=False,look_for_keys=False,timeout=20)
          sftp=client.open_sftp()
          root=sftp.normalize('.')
          # Restricted SFTP account must expose the verified site at its root.
          assert sftp.stat('wp-content/themes/ramon-native/style.css').st_size>0
          assert sftp.stat('wp-content/plugins/ramon-site/ramon-site.php').st_size>0
          assert sftp.stat('1-ramon-image-alias.php').st_size>0
          assert sftp.stat('wp-content/rm-backup-unused/rn-map.json').st_size>0
          protected=['.htaccess','1-ramon-image-alias.php','wp-content/rm-backup-unused/rn-map.json']
          before_protected={p:digest(sftp.open(p,'rb').read()) for p in protected}
          manifest=json.loads(pathlib.Path('docs/source-manifest.json').read_text())
          state_path='.ramon-deploy-backups/deployed-manifest.json'
          try: deployed=json.loads(sftp.open(state_path,'rb').read())
          except FileNotFoundError: deployed={}
          assert isinstance(deployed,dict)
          files=[]
          for folder in ['wp-content/themes/ramon-native','wp-content/plugins/ramon-site','wp-content/plugins/ramon-touring']:
              for p in pathlib.Path(folder).rglob('*'):
                  if p.is_file():
                      assert not p.is_symlink()
                      files.append(p)
          changes=[]
          for p in files:
              name=p.as_posix();new=p.read_bytes()
              try:
                  info=sftp.lstat(name);assert stat.S_ISREG(info.st_mode)
                  old=sftp.open(name,'rb').read();mode=stat.S_IMODE(info.st_mode)
              except FileNotFoundError:
                  old=None;mode=0o644
              # Abort if production diverged since the source baseline.
              expected=deployed.get(name) or manifest.get(name)
              if old is not None and (not expected or digest(old)!=expected['sha256']) and old!=new:
                  raise RuntimeError('Production drift: '+name)
              if old!=new:changes.append((name,new,old,mode))
          dry=os.environ['DRY_RUN'].lower()=='true'
          print('SFTP authenticated; root validated. Compared',len(files),'files. Changes',len(changes),'Dry run',dry)
          def health():
              for url in ['https://ramonmr.com/','https://ramonmr.com/en/','https://ramonmr.com/contacto-consultor-digital/']:
                  req=urllib.request.Request(url,headers={'User-Agent':'Ramon-site-deploy-check'},method='GET')
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read();assert r.status==200 and len(body)>1000
          health()
          if dry:
              assert os.environ['DRY_RUN'].lower()=='true'
              print('Dry-run change paths:',json.dumps([name for name,new,old,mode in changes]))
              print('Dry-run is read-only: no upload, rename, chmod, mkdir, backup or state update')
          if not dry:
              # Test upload/readback/atomic rename on a harmless unique temporary file.
              tag=str(int(time.time()))
              a='wp-content/themes/ramon-native/.deploy-check-'+tag+'.tmp'
              b='wp-content/themes/ramon-native/.deploy-check-'+tag+'.txt'
              payload=b'ramonmr deployment transport verification\n'
              try:
                  with sftp.open(a,'wx') as f:f.write(payload)
                  sftp.chmod(a,0o600)
                  assert sftp.open(a,'rb').read()==payload
                  sftp.posix_rename(a,b)
                  assert sftp.open(b,'rb').read()==payload
              finally:
                  for temp in [a,b]:
                      try:sftp.remove(temp)
                      except FileNotFoundError:pass
              print('Temporary upload/readback/atomic rename verified and removed')
          if not dry and changes:
              stamp=str(int(time.time()));backup='.ramon-deploy-backups/'+stamp
              def mkdirs(path,mode=0o755):
                  current=''
                  for part in pathlib.PurePosixPath(path).parts:
                      current=(current+'/' if current else '')+part
                      try:sftp.mkdir(current,mode)
                      except IOError:pass
              mkdirs(backup,0o700)
              sftp.chmod('.ramon-deploy-backups',0o700);sftp.chmod(backup,0o700)
              for name,new,old,mode in changes:
                  if old is not None:
                      dest=backup+'/'+name;mkdirs(str(pathlib.PurePosixPath(dest).parent),0o700)
                      with sftp.open(dest,'wb') as f:f.write(old)
                      sftp.chmod(dest,0o600)
                      assert sftp.open(dest,'rb').read()==old
              applied=[]
              try:
                  for name,new,old,mode in changes:
                      mkdirs(str(pathlib.PurePosixPath(name).parent))
                      temp=name+'.deploy-'+stamp+'.tmp'
                      with sftp.open(temp,'wb') as f:f.write(new)
                      sftp.chmod(temp,0o600)
                      assert sftp.open(temp,'rb').read()==new
                      sftp.posix_rename(temp,name);applied.append((name,old,mode))
                      sftp.chmod(name,mode)
                      assert sftp.open(name,'rb').read()==new
                  health()
                  assert before_protected=={p:digest(sftp.open(p,'rb').read()) for p in protected}
              except Exception:
                  for name,old,mode in reversed(applied):
                      if old is None:sftp.remove(name)
                      else:
                          temp=name+'.rollback-'+stamp+'.tmp'
                          with sftp.open(temp,'wb') as f:f.write(old)
                          sftp.chmod(temp,0o600);sftp.posix_rename(temp,name);sftp.chmod(name,mode)
                          assert sftp.open(name,'rb').read()==old
                  health();raise
              print('Verified deployment. Private remote rollback copy:',backup)
          assert before_protected=={p:digest(sftp.open(p,'rb').read()) for p in protected}
          if not dry:
              try:sftp.mkdir('.ramon-deploy-backups',0o700)
              except IOError:pass
              sftp.chmod('.ramon-deploy-backups',0o700)
              state=json.dumps({p.as_posix():{'sha256':digest(p.read_bytes())} for p in files},sort_keys=True).encode()
              temp=state_path+'.tmp'
              with sftp.open(temp,'wb') as f:f.write(state)
              sftp.chmod(temp,0o600)
              assert sftp.open(temp,'rb').read()==state
              sftp.posix_rename(temp,state_path)
              print('Recorded verified deployment baseline')
          sftp.close();client.close()
          PY
